# Crea installer e versione portatile per Windows e li pubblica nella pagina Releases.
# Parte con il push di un tag v* oppure a mano da Actions → Release → Run workflow:
# il tag viene creato in automatico dalla versione in package.json.
# La chiave CurseForge, se presente, arriva dal secret CF_API_KEY e non finisce mai nel codice.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installer e portatile
        run: npm run dist
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Versione
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: CraftDock ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
